[project]
name = "glowroot-explain"
version = "0.1.0"
description = "Paste a Glowroot JDBC trace, get a ready-to-run PostgreSQL EXPLAIN statement"
requires-python = ">=3.11"
dependencies = ["flask"]

[tool.setuptools]
py-modules = ["app", "glowroot_parser"]

[project.scripts]
glowroot-explain = "app:main"

[tool.pytest.ini_options]
addopts = "--tb=short"
